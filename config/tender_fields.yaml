{
  "schema_version": "rfp-field-schema.v1",
  "schema_id": "tender-agent-reviewed-condensed-v2",
  "prompt": "Build the effective tender facts from the base tender and all binding corrigenda, addenda, and issuer clarifications. Preserve exact values, conditions, exceptions, contradictions, required bidder proof, and page-level evidence. For grouped fields, return concise labelled items such as 'Bid number: ...' or 'Technical weight: ...'. Do not invent missing subfacts and do not treat bidder requests as amendments unless the issuer accepts them.",
  "sections": [
    {
      "key": "tender_overview",
      "label": "Tender Overview",
      "prompt": "Resolve the tender's identity, scope, commercial basics, dates, locations, and procurement preferences.",
      "fields": [
        {
          "key": "tender_summary",
          "label": "Tender Summary",
          "description": "Concise executive summary of the effective tender.",
          "value_type": "string",
          "prompt": "Summarize the buyer, procurement purpose, major scope and deliverables, locations, value and bid security when stated, submission deadline, evaluation method, and principal eligibility themes. Use only grounded facts and apply amendments.",
          "retrieval_guidance": {
            "aliases": ["tender summary", "executive summary", "procurement overview", "bid overview"],
            "likely_sections": ["Cover Page", "Bid Details", "Notice Inviting Tender", "Scope of Work", "Tender Data Sheet", "Evaluation"]
          }
        },
        {
          "key": "tender_identity",
          "label": "Tender Identity",
          "description": "Official procurement numbers and issuing buyer.",
          "value_type": "string_array",
          "prompt": "Return separately labelled items for GeM Bid Number, buyer's internal tender/RFP/reference number, and the actual legal issuing organisation. Inspect the cover page and first page of every tender source before deciding. Never return generic portal labels such as Buyer Organization, Purchaser, Principal, Buyer, or Issuing Authority as the organisation; if no real organisation name is evidenced, abstain. If an official GeM bid is present, label its Bid Number as the canonical tender number while retaining the internal reference separately. Never use a corrigendum number, filename number, UUID, or portal database ID as the tender number.",
          "retrieval_guidance": {
            "aliases": ["gem bid", "ref gem bid", "bid number", "tender number", "rfp number", "reference number", "enquiry number", "buyer", "purchaser", "issuing authority", "organisation name", "organization name", "issued by"],
            "anchor_phrases": ["gem bid", "bid number", "tender number", "rfp number", "invites bids", "invites proposals"],
            "likely_sections": ["Cover Page", "Bid Details", "Notice Inviting Tender", "Invitation for Bids", "Tender Data Sheet"]
          }
        },
        {
          "key": "tender_subject_classification",
          "label": "Tender Subject and Classification",
          "description": "Official title, procurement route, category, and mixed scope.",
          "value_type": "string_array",
          "prompt": "Return separately labelled items for official title or name of work, tender/procurement type, procurement category, and material goods, licence, implementation, maintenance, support, works, or consultancy components. Treat the BOQ title or name of work as the overall tender subject. Never promote one BOQ line item, SKU, size, model, or variant to the primary procurement category; list those only as item categories.",
          "retrieval_guidance": {
            "aliases": ["tender title", "name of work", "boq title", "subject", "tender type", "procurement method", "product category", "service category"],
            "likely_sections": ["Cover Page", "Bid Details", "Notice Inviting Tender", "Scope of Work", "Tender Data Sheet"]
          }
        },
        {
          "key": "estimated_procurement_value",
          "label": "Estimated Procurement Value",
          "description": "Stated estimated tender, project, procurement, or contract value.",
          "value_type": "string_array",
          "prompt": "Return the exact labelled estimated tender, project, procurement, or contract amount with currency and tax basis. Search cover pages, GeM Bid Details, tender data sheets, commercial schedules, special purchase conditions, and labelled table cells. Preserve multiple lots or components separately. If the document only says that an estimated value is indicated elsewhere without stating the amount, return not found. Do not infer an estimate from EMD, fees, turnover, quantities, or bidder prices.",
          "retrieval_guidance": {
            "aliases": ["estimated cost", "estimated value", "estimated bid value", "estimated contract value", "tender value", "total tender value", "project cost", "contract value", "value of procurement", "approximate value"],
            "anchor_phrases": ["estimated bid value", "estimated tender value", "estimated procurement value", "estimated cost"],
            "likely_sections": ["Cover Page", "Bid Details", "Notice Inviting Tender", "Tender Data Sheet", "Key Information", "Commercial", "Special Purchase Conditions"]
          }
        },
        {
          "key": "bid_security_and_fees",
          "label": "Bid Security and Fees",
          "description": "EMD, bid security, tender fee, processing fee, and related rules.",
          "value_type": "string_array",
          "prompt": "Return separately labelled items for EMD or bid-security amount, tender/document/processing fee, accepted instruments, issuer, validity and claim periods, payment channel, deadlines, exemptions, forfeiture or return rules, and every required proof document. Do not merge EMD with performance security.",
          "retrieval_guidance": {
            "aliases": ["emd", "earnest money", "bid security", "bid bond", "tender fee", "document fee", "processing fee"],
            "anchor_phrases": ["emd amount", "earnest money", "bid security", "tender fee"],
            "likely_sections": ["Bid Details", "Tender Data Sheet", "Bid Security", "Fees", "Instructions to Bidders"]
          }
        },
        {
          "key": "tender_timeline",
          "label": "Tender Timeline",
          "description": "Effective publication, submission, opening, and other controlling dates.",
          "value_type": "string_array",
          "prompt": "Return separately labelled effective dates and times for publication/issue, pre-bid events, submission deadline, technical opening, commercial opening, and other material milestones. Apply the latest binding extension and retain timezone or 'to be intimated later' wording.",
          "retrieval_guidance": {
            "aliases": ["publish date", "issue date", "bid submission end date", "closing date", "bid opening date", "technical bid opening", "commercial bid opening"],
