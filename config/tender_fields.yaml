          "label": "Evaluation Scoring",
          "description": "Technical and financial weights, minimum scores, and score allocation.",
          "value_type": "string_array",
          "prompt": "Return separately labelled technical weight, financial weight, minimum technical qualifying score, section or subscore thresholds, total score, scoring bands, formulas, and revised allocations. Preserve percentages and points exactly.",
          "retrieval_guidance": {
              "aliases": ["technical weightage", "financial weightage", "minimum technical score", "qualifying score", "score allocation", "marks", "total marks", "total score", "vendor score", "technical audit checklist"],
              "anchor_phrases": ["grand total", "total marks", "total score", "total / vendor score"],
              "likely_sections": ["Technical Evaluation", "Financial Evaluation", "Scoring Matrix", "Technical Audit Checklist", "QCBS"]
