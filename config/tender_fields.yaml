          "retrieval_guidance": {
            "aliases": ["mse", "msme", "micro and small enterprise", "startup", "udyam", "nsic", "purchase preference", "emd exemption"],
            "likely_sections": ["MSE Preference", "Startup Relaxation", "Eligibility", "Exemptions", "Purchase Preference"]
          }
        },
        {
          "key": "make_in_india_policy",
          "label": "Make in India Policy",
          "description": "Local-supplier and local-content preference requirements.",
          "value_type": "string_array",
          "prompt": "Return applicability, supplier class, minimum local-content percentage, margin of preference, purchase allocation, declaration, verification, auditor/certifier requirements, exemptions, and proof documents.",
          "retrieval_guidance": {
            "aliases": ["make in india", "local supplier", "local content", "class i supplier", "public procurement preference"],
            "likely_sections": ["Make in India", "Purchase Preference", "Local Content", "Eligibility"]
          }
        }
      ]
    },
    {
      "key": "evaluation_and_participation",
      "label": "Evaluation and Participation",
      "prompt": "Resolve bidding structure, evaluation mechanics, award controls, participant eligibility, declarations, and financial or experience qualification.",
      "fields": [
        {
          "key": "evaluation_method",
          "label": "Evaluation Method",
          "description": "Complete selection and evaluation method.",
          "value_type": "string_array",
          "prompt": "Return every evaluation stage and gate, including responsiveness, eligibility, technical, presentation/POC, commercial and final selection; identify L1, QCBS, LCS, highest score, item-wise, total-value-wise, or other method and preserve formulas, tie-breakers, rounding, normalization, outlier, arithmetic-correction, rejection, and amendment rules.",
          "retrieval_guidance": {
            "aliases": ["evaluation method", "evaluation methodology", "selection method", "l1", "qcbs", "least cost", "combined score"],
            "likely_sections": ["Evaluation", "Award Criteria", "Tender Data Sheet", "Instructions to Bidders"]
          }
        },
        {
          "key": "bid_structure_and_auction",
          "label": "Bid Structure and Auction",
          "description": "Envelope structure, bidding system, bid parts, and auction rules.",
          "value_type": "string_array",
          "prompt": "Return separately labelled bid/envelope structure, one-stage/two-stage or one-cover/two-cover system, technical and commercial separation, alternative bids, and reverse-auction applicability. Treat an explicit field such as Bid to RA enabled: Yes/No as controlling. Do not infer reverse-auction participation from a generic mention of RA, auction, or commercial rules. Preserve auction rules and commercial quarantine controls separately.",
          "retrieval_guidance": {
            "aliases": ["bidding system", "two bid system", "two cover", "envelope", "reverse auction", "bid to ra enabled", "ra enabled", "auction enabled", "commercial bid"],
            "likely_sections": ["Bid Details", "Submission Instructions", "Evaluation", "Reverse Auction"]
          }
        },
