          "retrieval_guidance": {
            "aliases": ["h1 elimination", "highest bidder elimination", "highest bid", "outlier bid", "abnormally high bid"],
            "likely_sections": ["Financial Evaluation", "Commercial Evaluation", "Award Criteria"]
