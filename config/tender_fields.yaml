          "value_type": "string_array",
          "prompt": "Return every material location with its role: work/service footprint, delivery site, buyer offices, DC, DR, resource deployment, or bid submission. Do not mistake letterhead or meeting addresses for service locations.",
          "retrieval_guidance": {
            "aliases": ["work location", "place of work", "delivery location", "project location", "data center", "data centre", "disaster recovery", "branches and offices"],
