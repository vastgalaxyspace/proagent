          "prompt": "Return preference margin percentages, eligible classes, explicit reservation or non-reservation status, L1 matching bands, reserved shares, order or quantity splitting, allocation among bidders, tie rules, and conditions. Distinguish Reserved for MSE: Yes/No from ordinary MSE purchase preference and from Make-in-India preference. Keep MSE and Make-in-India labels explicit when applicable.",
          "retrieval_guidance": {
